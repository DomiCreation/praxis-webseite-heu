<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1FA58C">
  <meta name="description" content="Internistische Hausarztpraxis Dr. med. univ. Zana Gubetini-Bicaj in Heusenstamm. Termin online buchen.">
  <meta name="robots" content="noindex, follow">
  <title>Termin buchen | Praxis Gubetini-Bicaj</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0e2a31;
      --teal: #1fa58c;
      --teal-dark: #16806c;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      color: var(--white);
      font-family: Outfit, ui-sans-serif, sans-serif;
      background: var(--ink);
      overflow: hidden;
    }

    .stage {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 48px);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(160deg, rgba(14, 42, 49, 0.72) 0%, rgba(14, 42, 49, 0.45) 45%, rgba(31, 165, 140, 0.28) 100%),
        url("assets/praxis-empfang.jpg") center / cover no-repeat;
      transform: scale(1.04);
      animation: drift 18s ease-in-out infinite alternate;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(14, 42, 49, 0.15), transparent 70%),
        linear-gradient(to top, rgba(14, 42, 49, 0.55), transparent 42%);
      pointer-events: none;
    }

    .panel {
      width: min(560px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(28px, 5vw, 40px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo-box {
      width: min(460px, 100%);
      padding: clamp(18px, 3.5vw, 28px) clamp(22px, 4vw, 36px);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      animation: logo-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .actions {
      width: min(320px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
    }

    .cta,
    .phone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .cta {
      background: var(--teal);
      color: var(--white);
      border: 1px solid var(--teal);
      box-shadow: 0 16px 40px rgba(14, 42, 49, 0.35);
    }

    .cta:hover {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
      transform: translateY(-2px);
      box-shadow: 0 22px 48px rgba(14, 42, 49, 0.4);
    }

    .phone {
      flex-direction: column;
      gap: 2px;
      padding: 12px 22px;
      background: rgba(255, 255, 255, 0.14);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(14, 42, 49, 0.22);
    }

    .phone small {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .phone:hover {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
    }

    .cta:focus-visible,
    .phone:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .cta:active,
    .phone:active {
      transform: translateY(0);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logo-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes drift {
      from {
        transform: scale(1.04) translate3d(0, 0, 0);
      }
      to {
        transform: scale(1.08) translate3d(-1.2%, -0.8%, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage::before,
      .panel,
      .logo-box,
      .actions {
        animation: none;
      }

      .stage::before {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="panel">
      <div class="logo-box">
        <img
          class="logo"
          src="assets/praxis-logo.png"
          alt="Internistische Hausarztpraxis Dr. med. univ. Zana Gubetini-Bicaj"
          width="1897"
          height="269"
        >
      </div>
      <div class="actions">
        <a
          class="cta"
          href="https://www.etermin.net/arztpraxis-gubetini"
          target="_blank"
          rel="noopener noreferrer"
        >Termin buchen</a>
        <a class="phone" href="tel:+4961047899978">
          <small>Praxis</small>
          06104 78 999 78
        </a>
        <a class="phone" href="tel:+4961047899966">
          <small>Rezepttelefon</small>
          06104 78 999 66
        </a>
      </div>
    </div>
  </main>
</body>
</html>
